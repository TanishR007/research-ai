[project]
name = "research-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanish", email = "rangnanitanish07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "finnhub-python>=2.4.29",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "tavily-python>=0.8.1",
    "twelvedata>=1.4.0",
]

[project.scripts]
research-ai = "research_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
